[tool.poetry]
name = "fit--bootstrap"
version = "1.0.1"
description = "FIT Bootstrap Module"
authors = ["FIT Project"]
license = "LGPL-3.0-or-later"
packages = [
    { include = "fit_bootstrap", from = ".", format = "sdist" }
]
exclude = ["fit_bootstrap/macos/ui/**", "fit_bootstrap/mitmproxy_addons/**", "fit_bootstrap/mitmproxy_runner.py", "fit_bootstrap/macos/proxy.py"]

include = [
    "fit_assets/mitmproxy/mitmproxy-ca-cert.pem"
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

fit-common = {git = "https://github.com/fit-project/fit-common.git", branch = "main"}
fit-assets = {git = "https://github.com/fit-project/fit-assets.git", tag = "v1.0.0-rc2"}


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]
markers = [
    "unit: fast isolated tests",
    "contract: cross-module contract tests for public interfaces and integrations",
    "integration: integration tests with real external resources and dependencies",
    "e2e: end-to-end UI workflow tests",
]

[tool.mypy]
python_version = "3.12"
exclude = '''(?x)(
    ^fit_bootstrap/macos/proxy\.py$
  | ^fit_bootstrap/mitmproxy_runner\.py$
  | ^fit_bootstrap/mitmproxy_addons/.*
)'''

[[tool.mypy.overrides]]
module = [
    "fit_common",
    "fit_common.*",
    "fit_assets",
    "fit_assets.*",
    "mitmproxy",
    "mitmproxy.*",
]
ignore_missing_imports = true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
